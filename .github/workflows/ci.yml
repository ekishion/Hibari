name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只读仓库内容即可完成全部检查，不给多余权限。
permissions:
  contents: read

# 同一分支重复推送时取消上一次，避免排队浪费额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: 测试
        run: go test -race ./...

  frontend:
    name: 前端
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

  docker:
    name: 镜像
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    # 镜像构建最慢且只验证不推送，PR 上跳过以换取快速反馈。
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 只验证镜像能构建，不推送。
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
