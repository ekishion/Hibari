{{define "unlock_modal"}}
  <!-- 访客端提取码输入弹窗 -->
  <div id="unlock-overlay" class="modal-overlay" hidden aria-hidden="true">
    <div class="unlock-card" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
      <span class="unlock-mark" data-icon="lock" aria-hidden="true"></span>
      <h2 id="unlock-title">请输入提取码</h2>
      <p id="unlock-desc">该分享目录受访问码保护，验证后即可继续浏览</p>
      <form id="unlock-form" novalidate>
        <div class="input-wrap">
          <span class="input-icon" data-icon="key-round" aria-hidden="true"></span>
          <input id="unlock-pwd-input" type="text" maxlength="16" autocomplete="off" required placeholder="请输入提取码" autofocus>
        </div>
        <div class="login-actions">
          <button type="submit" id="btn-unlock-submit" class="btn btn-primary">
            <span class="btn-icon" data-icon="unlock" aria-hidden="true"></span>
            <span class="btn-label">提取文件</span>
          </button>
        </div>
        <div id="unlock-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>
{{end}}
