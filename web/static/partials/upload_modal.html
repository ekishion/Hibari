{{define "upload_modal"}}
  <!-- 上传弹窗 -->
  <div id="upload-overlay" class="modal-overlay" hidden aria-hidden="true">
    <div class="upload-card" role="dialog" aria-modal="true" aria-labelledby="upload-dialog-title">
      <div class="upload-card-header">
        <div class="upload-card-title-group">
          <span class="upload-mark" data-icon="upload" aria-hidden="true"></span>
          <div>
            <h2 id="upload-dialog-title">上传文件</h2>
            <p class="upload-target" id="upload-target-dir" title="目标目录">/</p>
          </div>
        </div>
        <button type="button" id="upload-close" class="modal-close" aria-label="关闭上传窗口">
          <span data-icon="x" aria-hidden="true"></span>
        </button>
      </div>

      <!-- 剩余容量 -->
      <div class="upload-quota" id="upload-quota" aria-live="polite">
        <div class="upload-quota-text" id="upload-quota-text">正在获取网盘容量…</div>
        <div class="upload-quota-bar" aria-hidden="true">
          <div class="upload-quota-fill" id="upload-quota-fill"></div>
        </div>
      </div>

      <!-- 拖拽/选择区 -->
      <div class="upload-dropzone" id="upload-dropzone" tabindex="0" role="button"
        aria-label="选择要上传的文件，或把文件拖到这里">
        <span class="upload-dropzone-icon" data-icon="upload" aria-hidden="true"></span>
        <p class="upload-dropzone-title">点击选择文件，或把文件拖到这里</p>
        <p class="upload-dropzone-hint" id="upload-dropzone-hint">单文件上限 2 GB</p>
        <input type="file" id="upload-file-input" multiple hidden>
      </div>

      <!-- 文件清单 -->
      <ul class="upload-file-list" id="upload-file-list" aria-label="待上传文件清单"></ul>

      <div class="upload-actions">
        <span class="upload-actions-hint" id="upload-summary"></span>
        <button type="button" class="btn btn-primary" id="btn-upload-start" disabled>
          <span class="btn-icon" data-icon="upload" aria-hidden="true"></span>
          <span class="btn-label">开始上传</span>
        </button>
      </div>
    </div>
  </div>
{{end}}
