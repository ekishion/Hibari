{{define "login_modal"}}
  <div id="login-overlay" hidden aria-hidden="true">
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <span class="login-mark" data-icon="shield-lock" aria-hidden="true"></span>
      <h2 id="login-title">验证访问权限</h2>
      <p>该网盘已开启访问保护，输入访问令牌即可浏览和下载文件。</p>
      <form id="login-form" novalidate>
        <label for="login-token">访问令牌</label>
        <div class="input-wrap">
          <span class="input-icon" data-icon="key-round" aria-hidden="true"></span>
          <input id="login-token" name="access_token" type="password" autocomplete="current-password" required
            placeholder="请输入访问令牌">
        </div>
        <div class="login-actions">
          <button type="submit" id="btn-login" class="btn btn-primary">
            <span class="btn-icon" data-icon="log-in" aria-hidden="true"></span>
            <span class="btn-label">验证并进入</span>
          </button>
        </div>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>
{{end}}
