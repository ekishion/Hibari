{{define "shares_manage"}}
  <!-- 活跃分享管理弹窗 -->
  <div id="shares-manage-overlay" class="modal-overlay" hidden aria-hidden="true">
    <div class="shares-manage-card" role="dialog" aria-modal="true" aria-labelledby="shares-manage-title">
      <div class="shares-manage-header">
        <div class="share-card-title-group">
          <span class="share-mark" data-icon="share-2" aria-hidden="true"></span>
          <div>
            <h2 id="shares-manage-title">活跃分享管理</h2>
            <p class="shares-manage-subtitle">查看所有已生效的外链，支持随时手动撤销</p>
          </div>
        </div>
        <button type="button" id="shares-manage-close" class="modal-close" aria-label="关闭分享管理窗口">
          <span data-icon="x" aria-hidden="true"></span>
        </button>
      </div>

      <!-- 分享管理导航栏与统计 -->
      <div class="shares-manage-tabs" role="tablist">
        <button type="button" class="shares-tab is-active" data-tab="all" role="tab" aria-selected="true">全部 (<span id="shares-count-all">0</span>)</button>
        <button type="button" class="shares-tab" data-tab="files" role="tab" aria-selected="false">文件 (<span id="shares-count-files">0</span>)</button>
        <button type="button" class="shares-tab" data-tab="dirs" role="tab" aria-selected="false">文件夹 (<span id="shares-count-dirs">0</span>)</button>
      </div>

      <!-- 工具栏：筛选与刷新 -->
      <div class="shares-manage-toolbar">
        <div class="search-box">
          <span data-icon="search" aria-hidden="true"></span>
          <input type="search" id="shares-search-input" placeholder="筛选文件或目录名称…" autocomplete="off" aria-label="筛选分享">
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh-shares" aria-label="刷新列表" title="刷新分享列表">
          <span class="btn-icon" data-icon="refresh-cw" aria-hidden="true"></span>
          <span>刷新</span>
        </button>
      </div>

      <!-- 分享卡片容器 -->
      <div class="shares-manage-list" id="shares-manage-list" role="region" aria-label="分享列表">
        <div class="shares-loading" id="shares-loading">
          <span class="btn-spinner" data-icon="loader" aria-hidden="true"></span>
          <span>正在加载活跃分享…</span>
        </div>
      </div>
    </div>
  </div>
{{end}}
