{{define "lightbox"}}
  <div id="image-lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="关闭预览">
      <span data-icon="x" aria-hidden="true"></span>
    </button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev" type="button" aria-label="上一张" hidden>
      <span data-icon="chevron-left" aria-hidden="true"></span>
    </button>
    <button id="lightbox-next" class="lightbox-nav lightbox-next" type="button" aria-label="下一张" hidden>
      <span data-icon="chevron-right" aria-hidden="true"></span>
    </button>
    <div id="lightbox-stage">
      <div id="lightbox-spinner" class="lightbox-spinner" hidden aria-label="正在加载">
        <div class="spinner" data-icon="loader" aria-hidden="true"></div>
      </div>
      <img id="lightbox-image" alt="" hidden>
      <div id="lightbox-markdown" class="md-content" hidden></div>
      <pre id="lightbox-text" hidden></pre>
      <div id="lightbox-media" class="lightbox-media" hidden>
        <div id="media-disc" class="media-disc" hidden>
          <span class="media-disc-dot" aria-hidden="true"></span>
          <span class="media-disc-icon" data-icon="music" aria-hidden="true"></span>
        </div>
        <video id="lightbox-video" playsinline webkit-playsinline="true" x5-playsinline="true" hidden></video>
        <audio id="lightbox-audio" hidden></audio>
        <div class="media-bar">
          <button type="button" class="media-btn" id="media-play" aria-label="播放">
            <span class="btn-icon" data-icon="play" aria-hidden="true"></span>
          </button>
          <div id="media-seek" class="media-seek" role="slider" tabindex="0"
            aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
            <div class="media-track">
              <div id="media-fill" class="media-fill"></div>
              <div id="media-thumb" class="media-thumb"></div>
            </div>
          </div>
          <span id="media-time" class="media-time">0:00 / 0:00</span>
          <button type="button" class="media-btn" id="media-mute" aria-label="静音">
            <span class="btn-icon" data-icon="volume-2" aria-hidden="true"></span>
          </button>
          <button type="button" class="media-btn" id="media-fs" aria-label="全屏" hidden>
            <span class="btn-icon" data-icon="maximize" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
    <div id="lightbox-caption"></div>
  </div>
{{end}}
