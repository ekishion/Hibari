{{define "app_main"}}
  <div class="container" id="app-main">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" data-icon="cloud" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 class="wordmark">即刻轻盘</h1>
          <p class="subtitle">百度网盘青春版 · 安全中转</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="btn-theme" aria-label="切换深色模式">
          <span class="btn-icon" data-icon="moon" aria-hidden="true"></span>
        </button>
        <button type="button" class="btn btn-ghost" id="btn-shares-manage" hidden aria-label="活跃分享管理">
          <span class="btn-icon" data-icon="share-2" aria-hidden="true"></span>
          <span class="btn-label">分享管理</span>
        </button>
        <button type="button" class="btn btn-ghost" id="btn-login-open" hidden aria-label="登录">
          <span class="btn-icon" data-icon="log-in" aria-hidden="true"></span>
          <span class="btn-label">登录</span>
        </button>
        <button type="button" class="btn btn-ghost" id="btn-logout" hidden aria-label="退出">
          <span class="btn-icon" data-icon="log-out" aria-hidden="true"></span>
          <span class="btn-label">退出</span>
        </button>
      </div>
    </header>

    <nav class="breadcrumbs" id="breadcrumbs" aria-label="目录路径"></nav>

    <div class="toolbar">
      <span class="file-count" id="file-count">正在加载列表…</span>
      <div class="toolbar-actions">
        <label class="search-box" for="file-search">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="file-search" type="search" autocomplete="off" placeholder="筛选当前目录" aria-label="筛选当前目录文件">
        </label>
        <div class="sort-group" role="group" aria-label="排序方式">
          <button type="button" class="btn btn-ghost sort-trigger" id="btn-sort-field"
            aria-haspopup="listbox" aria-expanded="false" aria-label="选择排序字段">
            <span class="btn-label" id="sort-field-label">名称</span>
            <span class="btn-icon sort-caret" data-icon="chevron-down" aria-hidden="true"></span>
          </button>
          <button type="button" class="btn btn-ghost btn-sort-dir" id="btn-sort-dir" aria-label="切换升序降序">
            <span class="btn-icon" data-icon="arrow-up" aria-hidden="true"></span>
          </button>
          <div class="sort-menu" id="sort-menu" role="listbox" aria-label="排序字段" hidden>
            <button type="button" class="sort-option is-active" role="option" aria-selected="true" data-key="name">名称</button>
            <button type="button" class="sort-option" role="option" aria-selected="false" data-key="size">大小</button>
            <button type="button" class="sort-option" role="option" aria-selected="false" data-key="time">时间</button>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-upload" id="btn-upload" hidden
          aria-label="上传文件到当前目录">
          <span class="btn-icon" data-icon="upload" aria-hidden="true"></span>
          <span class="btn-label">上传</span>
        </button>
        <button type="button" class="btn btn-ghost btn-share" id="btn-share" hidden
          aria-label="分享当前目录">
          <span class="btn-icon" data-icon="share-2" aria-hidden="true"></span>
          <span class="btn-label">分享</span>
        </button>
        <button class="btn btn-refresh" id="btn-refresh" type="button" aria-label="刷新当前目录">
          <span class="btn-icon" data-icon="refresh-cw" aria-hidden="true"></span>
          <span class="btn-label">刷新</span>
        </button>
      </div>
    </div>

    <div id="list-banner" hidden></div>
    <section id="readme-panel" class="readme-panel" hidden aria-labelledby="readme-title">
      <div class="readme-layout">
        <div class="readme-main">
          <div class="readme-heading">
            <div class="readme-icon file-icon" aria-hidden="true">
              <span data-icon="file-text"></span>
            </div>
            <div>
              <h2 id="readme-title">目录说明</h2>
              <p id="readme-source">README</p>
            </div>
          </div>
          <div id="readme-content" class="md-content"></div>
        </div>
        <aside id="readme-overview" class="readme-overview" aria-label="目录概览"></aside>
      </div>
    </section>
    <div id="file-list"></div>

    <div id="status">
      <div class="spinner" data-icon="loader" aria-hidden="true"></div>
      <div class="status-tip">正在加载…</div>
    </div>

    <footer class="footer">
      <a href="https://github.com/malaohu/jikeqingpan" target="_blank" rel="noopener noreferrer">
        <span class="footer-icon" data-icon="github" aria-hidden="true"></span>GitHub
      </a>
      <a href="https://github.com/ekishion/jikeqingpan" target="_blank" rel="noopener noreferrer">
        <span class="footer-icon" data-icon="github" aria-hidden="true"></span>GitHub(二改)
      </a>
      <a href="https://n.eki.ink" target="_blank" rel="noopener noreferrer">
        <span class="footer-icon" data-icon="sparkles" aria-hidden="true"></span>梦澪の茶话会
      </a>
    </footer>
  </div>
{{end}}
